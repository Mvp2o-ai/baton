name: npm publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          node bin/baton.js --version
      # Trusted publisher (OIDC). Do not set NODE_AUTH_TOKEN here — a
      # long-lived token makes npm skip OIDC and the publish 401/404s.
      - name: Publish @batoncli/cli
        run: npm publish --access public --provenance
