name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: CLI via npm launcher
        run: node bin/baton.js --version

  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --git https://github.com/wiltshirek/txcript --rev b35b6bee9f996cc2aea58dadef0a54fb5fa1d2fe txcript-cli

  # Single required check for branch protection (matrix jobs become test (3.11), …).
  CI:
    needs: [test, converter]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All test jobs passed
        run: test "${{ needs.test.result }}" = "success" && test "${{ needs.converter.result }}" = "success"
