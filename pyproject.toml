[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homeswitch"
version = "0.1.0"
description = "Sidecar model switcher: one catalog, CLI home harnesses, same terminal pane."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Homeswitch contributors" }]
keywords = ["claude-code", "codex", "cursor", "txcript", "cli"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/homeswitch/homeswitch"
Issues = "https://github.com/homeswitch/homeswitch/issues"
Source = "https://github.com/homeswitch/homeswitch"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
homeswitch = "homeswitch.cli:main"

[tool.setuptools.packages.find]
include = ["homeswitch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
