name: npm publish

# Only a GitHub Release tagged vMAJOR.MINOR.PATCH publishes @batoncli/cli.
# Docs/asset tags (readme-hero, etc.) must not touch npm. Forks never publish
# the canonical package. Re-run from Actions is allowed if the ref is that tag.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REPO: ${{ github.repository }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          ok=false
          if [[ "$REPO" == "Mvp2o-ai/baton" && "$PRERELEASE" != "true" && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ok=true
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [[ "$ok" != "true" ]]; then
            echo "Not an npm release (repo=$REPO tag=$TAG prerelease=$PRERELEASE)."
            echo "Publish only on Mvp2o-ai/baton for tag vMAJOR.MINOR.PATCH (example: v0.1.0)."
          fi

  publish:
    needs: guard
    if: needs.guard.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          want="${TAG#v}"
          node_ver="$(node -p "require('./package.json').version")"
          py_ver="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          init_ver="$(python3 -c "import pathlib,re; t=pathlib.Path('baton/__init__.py').read_text(); print(re.search(r'^__version__ = \"([^\"]+)\"', t, re.M).group(1))")"
          echo "tag=$want package.json=$node_ver pyproject=$py_ver __version__=$init_ver"
          test "$want" = "$node_ver" && test "$want" = "$py_ver" && test "$want" = "$init_ver"
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          node bin/baton.js --version
      - name: Require NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set. Add a granular npm automation token (read/write on @batoncli) at Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Publish @batoncli/cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
